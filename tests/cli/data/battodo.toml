# The schedule the view goldens run under. With no schedule, a view
# shows every list at every hour.
[batconf]
default_env = "fixture"

[fixture.battodo.view]
time_zone = "America/Los_Angeles"
windows = "work=mon-fri 9-17; chores=mon-fri 17-21, sat-sun 10-20"
always_active = "study, career, events"
