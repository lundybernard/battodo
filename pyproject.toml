[project]
name = "battodo"
description = "Personal todo-list CLI (BAT ecosystem test-bed)"
authors = [{ name = "Lundy Bernard" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dynamic = ["version"]
# [toml] extra: on <=3.10 batconf's TomlSource needs the third-party
# toml package (stdlib tomllib is 3.11+); marker makes it a no-op above.
dependencies = ["batconf[toml]>=0.4.0"]

[project.scripts]
btodo = "battodo.cli:BATCLI"
btd = "battodo.cli:BATCLI"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# Single source of version truth. The poetry manifest duplicated it: a
# literal here plus a setup.py import of battodo/_version.py.
[tool.hatch.version]
path = "battodo/_version.py"

[tool.hatch.build.targets.sdist]
include = ["battodo/", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["battodo"]

[tool.pixi.workspace]
channels = ["conda-forge"]
# Unix-only, matching the CI matrix: the journal's flock single-writer
# (ADR 0004) has no Windows counterpart, and no target device runs it.
platforms = ["linux-64", "osx-arm64"]
# Cooldown: re-solves skip packages <3 days old (yank/malware window).
# Runs unaffected — the lock pins. Currency: periodic `pixi update`.
exclude-newer = "3d"

# Default feature: interpreter + project only. Tools live on their own
# features so each env is the minimum install for its job. The python
# spec mirrors requires-python; the concrete interpreter comes from a
# pyNNN feature, so one manifest can build an env per supported version.
[tool.pixi.dependencies]
python = ">=3.10"

[tool.pixi.pypi-dependencies]
battodo = { path = ".", editable = true }

# batconf is our own upstream — cooldown adds no supply-chain value.
[tool.pixi.pypi-exclude-newer]
batconf = "0d"

# Command-less public aggregators: staging + fail-fast live in these
# ordered depends-on lists. Env pins are mandatory — an unpinned
# depends-on resolves globally (ambiguous), not in the caller's env.
[tool.pixi.tasks]
tests = { depends-on = [
    { task = "_unit", environment = "test" },
    { task = "_integration", environment = "test" },
    { task = "_behavioral", environment = "test" },
    { task = "_typecheck", environment = "typecheck" },
    { task = "_lint", environment = "lint" },
] }
test = { depends-on = [{ task = "_test", environment = "test" }] }
unit = { depends-on = [{ task = "_unit", environment = "test" }] }
# Each layer runs the layers under it first, so a failure reports at
# the lowest level that shows it.
integration = { depends-on = [
    { task = "_unit", environment = "test" },
    { task = "_integration", environment = "test" },
] }
behavioral = { depends-on = [
    { task = "_unit", environment = "test" },
    { task = "_integration", environment = "test" },
    { task = "_behavioral", environment = "test" },
] }
# Same suite, one entry point per supported interpreter. CI fans these
# out; locally they are the way to check a requires-python claim.
unit-py310 = { depends-on = [{ task = "_unit", environment = "test-py310" }] }
unit-py311 = { depends-on = [{ task = "_unit", environment = "test-py311" }] }
unit-py312 = { depends-on = [{ task = "_unit", environment = "test-py312" }] }
unit-py313 = { depends-on = [{ task = "_unit", environment = "test-py313" }] }
unit-py314 = { depends-on = [{ task = "_unit", environment = "test-py314" }] }
typecheck = { depends-on = [
    { task = "_typecheck", environment = "typecheck" },
] }
lint = { depends-on = [{ task = "_lint", environment = "lint" }] }
# Deliberately outside the `tests` aggregator. Runtime is not the
# reason (~40s on 8 cores); the score is. Two thirds of the survivors
# are argparse help-string mutants no test can reasonably assert on,
# so there is no honest number to gate on until they are triaged.
mutate = { depends-on = [{ task = "_mutate", environment = "mutation" }] }

[tool.pixi.feature.test.dependencies]
coverage = "*"

# Stdlib unittest, no pytest. Isolation tests live beside the code
# (battodo/**/tests) and carry the 100% coverage gate. The top-level
# tests/ suites use real files and real dependencies, and stay outside
# that gate: coverage measures the isolation suite only.
[tool.pixi.feature.test.tasks]
# Quick manual run: no coverage, no gate.
_test = "python -m unittest discover --top-level-directory . --start-directory battodo --pattern '*_test.py'"
_unit = "coverage run --source=battodo -m unittest discover --top-level-directory . --start-directory battodo --pattern '*_test.py' && coverage report --fail-under=100"
_integration = "python -m unittest discover --top-level-directory tests --start-directory tests/integration --pattern '*_test.py'"
_behavioral = "python -m unittest discover --top-level-directory tests --start-directory tests/behavioral --pattern '*_test.py'"

[tool.pixi.feature.lint.dependencies]
ruff = "*"

[tool.pixi.feature.lint.tasks]
_lint = "ruff check battodo tests && ruff format --check battodo tests"

[tool.pixi.feature.typecheck.dependencies]
mypy = "*"

[tool.pixi.feature.typecheck.tasks]
_typecheck = "mypy battodo tests"

# Mutation testing: the structural answer to a 100%-coverage suite that
# still ships bugs (docs/lessons/). mutmut 3 drives pytest in-process —
# no unittest runner hook — so this env is the one place pytest exists;
# it collects the stdlib TestCase suite unchanged.
[tool.pixi.feature.mutation.dependencies]
pytest = "*"

[tool.pixi.feature.mutation.pypi-dependencies]
mutmut = ">=3.6"

[tool.pixi.feature.mutation.tasks]
# Files mutmut does NOT mutate get re-copied unconditionally every run,
# and the copy chmods its destination — EPERM when the existing copy
# belongs to another user. Pre-delete them: the
# do_not_mutate set plus pyproject.toml and the top-level tests/, both
# of which mutmut always copies.
# The mutated sources under mutants/battodo are skipped if they already
# exist, so they stay put as the incremental cache.
_mutate = "rm -rf mutants/pyproject.toml mutants/tests mutants/battodo/tests mutants/battodo/_version.py mutants/battodo/messages.py && mutmut run"

# Interpreter-only features: one per CPython in requires-python. They
# carry no tools — pair one with `test` to get that version's suite.
[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.environments]
# Spelled out to pin the dev interpreter at the newest supported
# version; a solve group resolves as one package set, so test,
# typecheck and dev inherit that same interpreter build.
default = { features = ["py314"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
# ruff is a standalone binary: no interpreter, no project install.
lint = { features = [
    "lint",
], no-default-feature = true, solve-group = "default" }
# mypy checks the test tree too, so it needs what the tests import.
typecheck = { features = ["typecheck", "test"], solve-group = "default" }
# mutmut needs the interpreter and the editable install, nothing from
# the test feature: it runs the suite through its own pytest.
mutation = { features = ["mutation"], solve-group = "default" }
dev = { features = [
    "test",
    "lint",
    "typecheck",
    "mutation",
], solve-group = "default" }
# The version matrix: what turns requires-python from a claim into a
# tested range. Each older interpreter needs its own solve group, since
# one group means one shared package set.
test-py310 = { features = ["py310", "test"] }
test-py311 = { features = ["py311", "test"] }
test-py312 = { features = ["py312", "test"] }
test-py313 = { features = ["py313", "test"] }
test-py314 = { features = ["py314", "test"], solve-group = "default" }

[tool.coverage.run]
data_file = ".cache/coverage"
omit = [
    # Test files: coverage measures the source, not the suite.
    "*/tests/*",
    # Build-time metadata. hatchling reads __version__ from here; nothing
    # imports it at runtime, so no unit test can legitimately reach it.
    "battodo/_version.py",
]

# No fail_under here — the 100% gate lives in the `unit` task so partial
# manual runs are not failures.
[tool.coverage.report]
skip_covered = true
show_missing = true
skip_empty = true

[tool.mutmut]
source_paths = ["battodo"]
# Patterns are fnmatch against the path. Tests are the oracle, not the
# subject. _version.py is build-time metadata the coverage gate omits
# too — nothing imports it at runtime, so its mutants are unkillable by
# construction and would be permanent noise in the survivor list.
do_not_mutate = [
    "*/tests/*",
    "*_test.py",
    "*/_version.py",
    # Pure data: display strings with no behaviour to assert on, so
    # their mutants are noise by construction. Every lookup that reads
    # the catalog stays under mutation -- a mangled key is a KeyError
    # the moment the parser is built.
    "*/messages.py",
]
# no:cacheprovider — a stale .pytest_cache across mutants is a lie.
pytest_add_cli_args = ["-p", "no:cacheprovider"]

[tool.mypy]
cache_dir = ".cache/mypy"
# strict = true is the goal; the imported template code needs a full
# annotation pass first (74 errors under --strict). Tracked in
# docs/lessons/project-template.md.

# === Ruff === #
[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 79

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# S101 flags `assert`; the unittest suites use assertion methods and are
# unaffected. N805 allows the `t` self-argument convention.
"**/*_test.py" = ["N805", "S101"]
