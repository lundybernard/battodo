name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # One leg per version: a failure on 3.11 should not hide 3.12.
      fail-fast: false
      matrix:
        # Unix-only by design: the journal's flock single-writer (ADR
        # 0004) has no Windows counterpart, and no target device runs
        # Windows.
        os: [ubuntu-latest, macos-latest]
        # Every CPython in requires-python, one pixi env each.
        py: [py311, py312, py313, py314, py315]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94  # v0.11.2
        with:
          pixi-version: v0.81.0
          locked: true
          # Install only this leg's env; the default env is unused here
          # and would be an extra download on every other leg.
          environments: test-${{ matrix.py }}
      - run: pixi run --locked unit-${{ matrix.py }}

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94  # v0.11.2
        with:
          pixi-version: v0.81.0
          locked: true
      - run: pixi run --locked typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94  # v0.11.2
        with:
          pixi-version: v0.81.0
          locked: true
      - run: pixi run --locked lint

  # One leg, on the default interpreter: the `ci` profile spends the
  # budget on a deeper search rather than on more versions.
  fuz:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94  # v0.11.2
        with:
          pixi-version: v0.81.0
          locked: true
          environments: test
      - run: HYPOTHESIS_PROFILE=ci pixi run --locked fuz

  # A survivor does not fail this job: mutmut exits 0 with survivors.
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94  # v0.11.2
        with:
          pixi-version: v0.81.0
          locked: true
          environments: mutation
      - run: pixi run --locked mutate

  all-checks:
    if: always()
    needs: [test, typecheck, lint, fuz, mutate]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          if [[ "${{ needs.test.result }}" != "success" || \
                "${{ needs.typecheck.result }}" != "success" || \
                "${{ needs.lint.result }}" != "success" || \
                "${{ needs.fuz.result }}" != "success" || \
                "${{ needs.mutate.result }}" != "success" ]]; then
            exit 1
          fi
